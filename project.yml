name: RetroMail
options:
  bundleIdPrefix: com.raynec
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "3.0"
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  RetroMail:
    type: application
    platform: iOS
    sources:
      - path: RetroMail
    info:
      path: RetroMail/Info.plist
      properties:
        CFBundleDisplayName: RetroMail
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans, en]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.raynec.retromail.refresh]
        NSPhotoLibraryUsageDescription: 用于在邮件中添加照片附件。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raynec.retromail
        PRODUCT_NAME: RetroMail
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: NO
